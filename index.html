<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-jesly.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/jesly-128.webp" type="image/webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FF228C" />
    <meta name="description" content="Jesly Boutique — Tu estilo, apartado para ti." />
    <!-- Instalación como app (iOS Safari + Android). iOS no soporta beforeinstallprompt: se instala
         manual con Compartir → Agregar a inicio; estos metas la hacen abrir en modo app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Jesly Boutique" />
    <title>Jesly Boutique</title>
    <style>
      /* Pantalla inicial mientras carga la app (React la reemplaza al montar). */
      html, body { margin: 0; background: #fbf7f4; }
      .arranque { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; }
      .arranque img { width: 112px; height: auto; border-radius: 22px; animation: arranque-respira 2.4s ease-in-out infinite; }
      @keyframes arranque-respira { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-4px) scale(1.03); } }
      @media (prefers-reduced-motion: reduce) { .arranque img { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="arranque" role="status" aria-label="Cargando Jesly Boutique">
        <img src="/jesly-128.webp" width="128" height="128" alt="" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
